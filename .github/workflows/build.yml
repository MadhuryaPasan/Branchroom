name: Build and test
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Linux native dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxi-dev libxrandr-dev libxcursor-dev libxinerama-dev libxkbcommon-dev libwayland-dev libgl1-mesa-dev
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - run: cargo test --all-targets --all-features --locked
      - run: cargo build --release --locked
      - name: Windows release package
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/Build-Windows.ps1 -SkipChecks
      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $metadata = cargo metadata --no-deps --format-version 1 --locked | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Cannot read package metadata.' }
          $version = ($metadata.packages | Where-Object name -EQ 'branchroom').version
          $iscc = @(
            (Get-Command iscc.exe -ErrorAction SilentlyContinue).Source
            'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
            'C:\Program Files\Inno Setup 6\ISCC.exe'
          ) | Where-Object { $_ -and (Test-Path -LiteralPath $_) } | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup --no-progress --yes
            if ($LASTEXITCODE -ne 0) { throw 'Could not install Inno Setup.' }
            $iscc = @(
              'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
              'C:\Program Files\Inno Setup 6\ISCC.exe'
            ) | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          }
          if (-not $iscc) { throw 'Inno Setup (ISCC.exe) is not installed on this runner.' }
          & $iscc "/DAppVersion=$version" "/DOutputDir=$env:GITHUB_WORKSPACE\dist" "$env:GITHUB_WORKSPACE\installer\Branchroom.iss"
          if ($LASTEXITCODE -ne 0) { throw 'Windows installer build failed.' }
          $latestPath = Join-Path $env:GITHUB_WORKSPACE 'dist/latest.json'
          $latest = Get-Content -LiteralPath $latestPath -Raw | ConvertFrom-Json
          $latest.PSObject.Properties.Remove('executable')
          $latest | Add-Member -NotePropertyName installer -NotePropertyValue "Branchroom-$version-Windows-x64-Setup.exe"
          $latest | Add-Member -NotePropertyName portableArchive -NotePropertyValue "$($latest.archive)"
          $latest | ConvertTo-Json | Set-Content -LiteralPath $latestPath -Encoding UTF8
      - name: Prepare release assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release-assets -Force | Out-Null

          if ($env:RUNNER_OS -eq 'Windows') {
            Copy-Item dist/*-Setup.exe release-assets/
            Copy-Item dist/*.zip release-assets/
            Copy-Item dist/latest.json release-assets/
          } else {
            $archive = "branchroom-${env:RUNNER_OS}-${env:RUNNER_ARCH}.tar.gz"
            tar -czf "release-assets/$archive" -C target/release branchroom
            if ($LASTEXITCODE -ne 0) { throw 'Archive creation failed.' }
          }

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: branchroom-${{ runner.os }}
          path: release-assets/*
          if-no-files-found: error

  publish-release:
    name: Publish Release
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release assets
        uses: actions/download-artifact@v8
        with:
          pattern: branchroom-*
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
          files: |
            artifacts/*.exe
            artifacts/*.zip
            artifacts/*.tar.gz
            artifacts/latest.json
